# Azure AI Foundry configuration for skwaq (EXAMPLE).
# Copy this file, fill in your values, and reference it.
# Do NOT commit real endpoints or credentials.

[general]
database_path = ".skwaq/graph"
log_level = "info"

[llm]
reasoning = "azure"
decompilation = "azure"
embeddings = "ollama"

[llm.azure]
endpoint = "https://<your-resource>.cognitiveservices.azure.com/"
deployment = "<your-deployment-name>"
api_version = "2024-10-21"
# api_key = "set AZURE_OPENAI_API_KEY env var instead"

[llm.copilot]
model = "claude-opus-4.6"

[llm.ollama]
host = "http://localhost:11434"
model = "llama3.1"
embedding_model = "nomic-embed-text"

[analysis]
max_taint_depth = 15
false_positive_target = 0.15
default_token_budget = 250000
