[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "crates/gym"]

[workspace.package]
version = "0.5.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Ryan Sweet <rysweet@microsoft.com>"]
repository = "https://github.com/rysweet/skwaq"

[workspace.dependencies]
# RustyClawd agent framework — pinned to a known-good main commit for reproducible builds.
# To update: run `cargo update -p rustyclawd-core -p rustyclawd-tools --precise <commit>`
rustyclawd-core = { git = "https://github.com/rysweet/RustyClawd", rev = "43ebaa1" }
rustyclawd-tools = { git = "https://github.com/rysweet/RustyClawd", rev = "43ebaa1" }

# Async
tokio = { version = "1", features = ["full"] }
futures = "0.3"
async-trait = "0.1"

# CLI
clap = { version = "4", features = ["derive", "cargo"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Error handling
anyhow = "1"
thiserror = "2"

# Logging / Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }
tracing-opentelemetry = "0.28"
opentelemetry = "0.27"
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.27", features = ["tonic"] }

# TUI
ratatui = "0.30"
crossterm = "0.28"

# HTTP
reqwest = { version = "0.12", features = ["json", "stream"] }

# Graph database
# LadybugDB (lbug crate) and kuzu both have CXX-bridge linking issues
# in downstream crates as of March 2026. Using SQLite with a graph-like
# schema as the working backend. Migration to LadybugDB is planned when
# linking is fixed - the schema is designed for easy Cypher translation.
rusqlite = { version = "0.31", features = ["bundled"] }

# Binary analysis
goblin = "0.10"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
tempfile = "3"
dirs = "6"
libc = "0.2"
humantime = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
