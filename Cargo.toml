[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "crates/gym", "crates/cybergym-adapter"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Ryan Sweet <rysweet@microsoft.com>"]
repository = "https://github.com/rysweet/skwaq"

[workspace.dependencies]
# RustyClawd agent framework — pinned to a known-good main commit for reproducible builds.
# To update: run `cargo update -p rustyclawd-core -p rustyclawd-tools -p rustyclawd-cli --precise <commit>`
rustyclawd-core = { git = "https://github.com/rysweet/RustyClawd", rev = "01f892236c3c66d53cf3a3141d7ff8ffbe3bf55b" }
rustyclawd-tools = { git = "https://github.com/rysweet/RustyClawd", rev = "01f892236c3c66d53cf3a3141d7ff8ffbe3bf55b" }
rustyclawd-cli = { git = "https://github.com/rysweet/RustyClawd", rev = "01f892236c3c66d53cf3a3141d7ff8ffbe3bf55b" }

# Async
tokio = { version = "1", features = ["full"] }
futures = "0.3"
async-trait = "0.1"

# CLI + TUI
clap = { version = "4", features = ["derive", "cargo"] }
ratatui = "0.29"
crossterm = "0.29"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Error handling
anyhow = "1"
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# HTTP
reqwest = { version = "0.12", features = ["json", "stream"] }

# Graph database
# LadybugDB (lbug crate) and kuzu both have CXX-bridge linking issues
# in downstream crates as of March 2026. Using SQLite with a graph-like
# schema as the working backend. Migration to LadybugDB is planned when
# linking is fixed - the schema is designed for easy Cypher translation.
rusqlite = { version = "0.31", features = ["bundled"] }

# Binary analysis
goblin = "0.10"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
tempfile = "3"
dirs = "6"
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
