suite = "fixtures"
version = "2.0"
download_url = ""
download_sha256 = ""

# === Positive test cases (contain vulnerabilities) ===

[[cases]]
id = "buffer_overflow"
path = "buffer_overflow.c"
binary_path = "binaries/buffer_overflow_O0"
# strcpy without bounds (CWE-121) + sprintf overflow (CWE-134)
expected_cwes = [121, 134]
is_negative = false
language = "c"

[[cases]]
id = "command_injection"
path = "command_injection.c"
