# Multi-file: inter-procedural vulnerability chain across compilation units
[[cases]]
id = "multi_file"
path = "multi_file/main.c"
binary_path = "binaries/multi_file_O0"
# Heap overflow in parser.c (CWE-122) + command injection in processor.c (CWE-78)
expected_cwes = [122, 78]
is_negative = false
language = "c"

# C++ vulnerability patterns
[[cases]]
id = "cpp_vulns"
path = "cpp_vulns.cpp"
binary_path = "binaries/cpp_vulns_O0"
# UAF via shared_ptr (CWE-416), buffer overflow (CWE-120), command injection (CWE-78)
expected_cwes = [416, 120, 78]
is_negative = false
language = "cpp"

