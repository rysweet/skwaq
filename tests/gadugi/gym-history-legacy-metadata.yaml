name: "Gym History Loads Legacy Metadata Rows"
description: |
  Verifies that `skwaq gym history` still renders history rows when the
  results database contains older runs with empty or partial metadata JSON.
version: "1.0.0"

config:
  timeout: 30000
  retries: 1
  parallel: false

agents:
  - name: "cli-agent"
    type: "system"
    config:
      shell: "bash"
      cwd: "."
      timeout: 30000
      capture_output: true

steps:
  - name: "Render history from legacy metadata rows"
    agent: "cli-agent"
    action: "execute_command"
    params:
      command: >
        tmpdir="$(mktemp -d)" &&
        python3 tests/gadugi/create_legacy_history_db.py "$tmpdir" &&
        XDG_DATA_HOME="$tmpdir" ./target/debug/skwaq gym history --limit 2
    expect:
      exit_code: 0
      stdout_contains:
        - "cyberseceval"
        - "fixtures"
        - "cafeba"
        - "deadbe"
    timeout: 10000

metadata:
  tags: ["cli", "smoke", "regression", "gym-history"]
  priority: "high"
