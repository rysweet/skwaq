name: "Gym Dashboard Loads Legacy Metadata Rows"
description: |
  Verifies that `skwaq gym dashboard` still generates trajectory charts and the
  scores table when the results database contains older runs with empty or
  partial metadata JSON.
version: "1.0.0"

config:
  timeout: 30000
  retries: 1
  parallel: false

agents:
  - name: "cli-agent"
    type: "system"
    config:
      shell: "bash"
      cwd: "."
      timeout: 30000
      capture_output: true

steps:
  - name: "Generate dashboard from legacy metadata rows"
    agent: "cli-agent"
    action: "execute_command"
    params:
      command: >
        tmpdir="$(mktemp -d)" &&
        python3 tests/gadugi/create_legacy_history_db.py "$tmpdir" &&
        cargo build -q -p skwaq &&
        XDG_DATA_HOME="$tmpdir" ./target/debug/skwaq gym dashboard
    expect:
      exit_code: 0
      stdout_contains:
        - "### Score Trajectory Charts"
        - "\"Fixtures\", \"Juliet\", \"CyberSecEval\""
        - "| **Juliet** | 74.7% | 80.0% | 70.0% |"
        - "| **CyberSecEval** | 44.4% | 50.0% | 40.0% |"
    timeout: 30000

metadata:
  tags: ["cli", "smoke", "regression", "gym-dashboard"]
  priority: "high"
