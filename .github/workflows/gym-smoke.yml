name: Gym Smoke
on: [pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Minimum F1 score (0.0-1.0) required to pass the benchmark gate.
  GYM_F1_THRESHOLD: "0.10"
  GYM_SMOKE_MAX_CASES: "5"
  GYM_JULIET_MAX_CASES: "20"

jobs:
  gym-smoke:
    runs-on: ubuntu-latest
    # No timeout: user requirement — this job must not be time-bounded.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build

      - name: Gym smoke test (fixtures, pattern mode)
        run: |
          ./target/debug/skwaq gym run fixtures --max-cases "$GYM_SMOKE_MAX_CASES" --quick
          echo "Gym smoke test passed"

      - name: Gym report (JSON)
        run: |
          ./target/debug/skwaq gym report --format json > gym-smoke-results.json
          cat gym-smoke-results.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gym-smoke-results
          path: gym-smoke-results.json

  ci-benchmark:
    runs-on: ubuntu-latest
    # No timeout: user requirement — this job must not be time-bounded.
    needs: gym-smoke
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build

      - name: Run fixtures benchmark (pattern mode)
        run: |
          ./target/debug/skwaq gym run fixtures --quick
          echo "Fixtures benchmark completed"

      - name: Run juliet subset benchmark (pattern mode)
        run: |
          if [ ! -d data/juliet ]; then
            echo "ERROR: data/juliet directory is absent — juliet benchmark data is required" >&2
            exit 1
          fi
          ./target/debug/skwaq gym run juliet --max-cases "$GYM_JULIET_MAX_CASES" --quick
          echo "Juliet subset benchmark completed"

      - name: Generate benchmark report
        run: |
          ./target/debug/skwaq gym report --format json > ci-benchmark-results.json
          cat ci-benchmark-results.json

      - name: Assert suite coverage
        run: |
          python3 - <<'EOF'
          import json, sys
          with open('ci-benchmark-results.json') as f:
              data = json.load(f)
          suites = data.get('suites', [])
          names = [s.get('name', '') for s in suites] if isinstance(suites, list) else list(suites.keys())
          if not any('fixture' in n.lower() for n in names):
              print("ERROR: fixtures suite missing from benchmark results", file=sys.stderr)
              sys.exit(1)
          if not any('juliet' in n.lower() for n in names):
              print("ERROR: juliet suite missing from benchmark results — fixture-only results are insufficient", file=sys.stderr)
              sys.exit(1)
          print(f"Suite coverage OK: {names}")
          EOF

      - name: Check F1 threshold
        run: |
          python3 - <<'EOF'
          import json, sys, os
          threshold = float(os.environ['GYM_F1_THRESHOLD'])
          with open('ci-benchmark-results.json') as f:
              data = json.load(f)
          f1 = float(data.get('f1', data.get('F1', 0)))
          print(f"F1 score: {f1:.4f}")
          print(f"Threshold: {threshold:.4f}")
          if f1 < threshold:
              print(f"FAIL: F1 {f1:.4f} is below threshold {threshold:.4f}", file=sys.stderr)
              sys.exit(1)
          print(f"PASS: F1 {f1:.4f} >= threshold {threshold:.4f}")
          EOF

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-benchmark-results
          path: ci-benchmark-results.json
